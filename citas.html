{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agendar Cita</title>

  <link rel="icon" href="{% static 'pacientes/img/logo.pag.png' %}" type="image/png">

  <link rel="stylesheet" href="{% static 'pacientes/style.css' %}">
</head>

<body>

<header>
  <div class="encabezado">

    <div class="logo">
      <img src="{% static 'pacientes/img/dentistalogo.png' %}" alt="logo" class="logo-img">
      <p class="parrafo1">Dental Care</p>
    </div>

    <nav>
      {% if user.is_authenticated %}
        <span class="nav-btn">
          Hola, {{ user.username }}
        </span>

        <a href="/logout/" class="nav-btn">
          Cerrar Sesión
        </a>

      {% else %}
        <a href="/login" class="nav-btn">
          Login
        </a>
      {% endif %}
        
      <a href="/dentista/" class="nav-btn">Inicio</a>

      <a href="/sobrenosotros/" class="nav-btn">
        ¿Quiénes somos?
      </a>

      <a href="/servicios/" class="nav-btn">
        Servicios
      </a>

      <a href="/mitratamiento/" class="nav-btn">
        Mi tratamiento
      </a>

      <a href="/contacto/" class="nav-btn">
        Contacto
      </a>
    </nav>

  </div>
</header>

<main>

<section class="container">

  <h2>📅 Agendar Cita</h2>

  <div class="cotizacion">

    <label>Nombre completo:</label>

    <input
      type="text"
      id="nombre"
      placeholder="Ingresa tu nombre"
    >

    <label>Teléfono:</label>

    <input
      type="tel"
      id="telefono"
      placeholder="Ej. 8123456789"
    >

    <label>Selecciona un servicio:</label>

    <select id="servicio">

      <option value="">
        -- Elige una opción --
      </option>

      <option>Limpieza Dental</option>

      <option>Ortodoncia</option>

      <option>Blanqueamiento</option>

      <option>Extracción</option>

      <option>Implantes</option>

      <option>Chequeo General</option>

    </select>

    <label>Fecha:</label>

    <input type="date" id="fecha">

    <label>Hora:</label>

    <input type="time" id="hora">

    <button onclick="agendarCita()">
      Confirmar Cita
    </button>

    <div class="resultado" id="resultado"></div>

  </div>

</section>

</main>

<footer>
  <p>
    © 2026 DentalCare | Todos los derechos reservados
  </p>
</footer>

<script>

function agendarCita() {

  const nombre = document.getElementById("nombre").value;

  const telefono = document.getElementById("telefono").value;

  const servicio = document.getElementById("servicio").value;

  const fecha = document.getElementById("fecha").value;

  const hora = document.getElementById("hora").value;

  const resultado = document.getElementById("resultado");

  if (!nombre || !telefono || !servicio || !fecha || !hora) {

    alert("Completa todos los campos");

    return;
  }

  resultado.textContent =
    "✅ Cita agendada correctamente";

  alert(
    `Cita confirmada:

Nombre: ${nombre}
Servicio: ${servicio}
Fecha: ${fecha}
Hora: ${hora}`
  );
}

</script>

</body>
</html>
